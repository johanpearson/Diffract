name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  # The job id "build" is a required status check in .github/rulesets/protect-main.json.
  # Renaming it blocks every PR from merging. Do not rename it.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Git version
        run: git --version

      # --- .NET: libraries, sidecar and their tests ---------------------------

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Diffract.slnx -c Release

      - name: Test
        run: dotnet test --solution Diffract.slnx -c Release --no-build

      - name: Publish the sidecar (Native AOT)
        shell: pwsh
        run: ./scripts/build-sidecar.ps1

      # --- UI ---------------------------------------------------------------

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI packages
        working-directory: ui
        run: npm ci

      - name: Type-check and test the UI
        working-directory: ui
        run: |
          npm run typecheck
          npm test

      # --- Tauri app and installer -------------------------------------------

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build the app and installer
        working-directory: ui
        run: npm run tauri -- build --ci

      # Release profile, so it reuses what the app build just compiled.
      - name: Test the Rust core
        working-directory: src-tauri
        run: cargo test --release --locked

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: diffract-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
