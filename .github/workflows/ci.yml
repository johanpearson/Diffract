name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels the run it replaces. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

# The work is split into jobs that run side by side: .NET tests (one job per test project), the UI, and the app.
# The job "build" waits for all of them and is the only one branch protection looks at.
#
# Caches: GitHub scopes caches by branch. A PR can read main's cache, but not another PR's.
# So only main saves the NuGet and Rust caches. PRs restore them and never spend time and quota saving their own.

jobs:
  # A PR that changes only docs (Markdown files anywhere, or anything under docs/) skips every other job and passes.
  # Anything else, this file included, gets the full run. Pushes to main always run everything.
  scope:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      # Two commits, so the next step can compare a PR's merge commit with main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Docs only?
        id: scope
        shell: pwsh
        run: |
          $code = 'true'
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $files = @(git diff --name-only HEAD^1 HEAD)
            $docs = @($files | Where-Object { $_ -like '*.md' -or $_ -like 'docs/*' })
            if ($files.Count -gt 0 -and $docs.Count -eq $files.Count) {
              $code = 'false'
              "Only docs changed, so nothing was built or tested:" >> $env:GITHUB_STEP_SUMMARY
              $files | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY
            }
          }
          "code=$code" >> $env:GITHUB_OUTPUT

  # --- .NET: libraries, sidecar and their tests -------------------------------
  # One job per test project, so each gets a whole runner. Between them they build every project in the solution.

  dotnet:
    name: .NET tests (${{ matrix.project }})
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project: [ Diffract.Git.Tests, Diffract.Leftovers.Tests, Diffract.Sidecar.Tests, Diffract.Spike.Tests ]
    env:
      PROJECT: tests/${{ matrix.project }}/${{ matrix.project }}.csproj
    steps:
      - uses: actions/checkout@v7

      - name: Git version
        run: git --version

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore the NuGet cache
        id: nuget-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('global.json', 'nuget.config', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.project }}-

      - name: Build
        run: dotnet build ${{ env.PROJECT }} -c Release

      # Each failing test also becomes an annotation, with the lines that say why, so it shows on the PR page and
      # in the checks API without opening the log.
      - name: Test
        shell: pwsh
        run: |
          dotnet test --project $env:PROJECT -c Release --no-build 2>&1 | ForEach-Object { "$_" } | Tee-Object -Variable lines
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Colour codes are removed first. When no test is named, the end of the output says why the run failed.
            $plain = @($lines | ForEach-Object { $_ -replace "\e\[[0-9;]*[A-Za-z]", '' })
            $failures = @($plain | Select-String -Pattern '^\s*failed ' -Context 0,4 | ForEach-Object { (@($_.Line.Trim()) + $_.Context.PostContext) -join "`n" })
            if ($failures.Count -eq 0) { $failures = @(($plain | Select-Object -Last 25) -join "`n") }
            foreach ($message in $failures) {
              $escaped = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Test failed::$escaped"
            }
          }
          exit $code

      - name: Save the NuGet cache
        if: github.ref == 'refs/heads/main' && steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

  # --- UI -----------------------------------------------------------------------
  # The end-to-end tests run against a fake sidecar in the page, so this job needs nothing from .NET.

  ui:
    name: UI tests
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI packages
        working-directory: ui
        run: npm ci

      - name: Type-check and test the UI
        working-directory: ui
        run: |
          npm run typecheck
          npm test

      # Playwright's Chromium is about 150 MB. The lockfile pins Playwright, so it only changes with it.
      - name: Cache Playwright's browser
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      - name: End-to-end tests (Playwright)
        working-directory: ui
        run: |
          npx playwright install chromium
          npm run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ui/playwright-report
          if-no-files-found: ignore

  # --- Sidecar (Native AOT), Tauri app and installer ------------------------------
  # Publishes the sidecar itself instead of waiting for the .NET tests, because Tauri bundles it into the app.

  app:
    name: App and installer
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore the NuGet cache
        id: nuget-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-sidecar-aot-${{ hashFiles('global.json', 'nuget.config', 'Directory.Packages.props', 'sidecar/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-sidecar-aot-

      - name: Publish the sidecar (Native AOT)
        shell: pwsh
        run: ./scripts/build-sidecar.ps1

      - name: Save the NuGet cache
        if: github.ref == 'refs/heads/main' && steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI packages
        working-directory: ui
        run: npm ci

      # A new Rust compiler makes every compiled crate useless, and runner image updates bring one.
      # So the compiler version is part of the cache key, and an older compiler's cache is never restored.
      - name: Rust version
        id: rust
        shell: pwsh
        run: |
          $version = ((rustc -V) -replace '[^A-Za-z0-9.]+', '-').Trim('-')
          Write-Output "rustc: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      # Only the parts of the Cargo home that the cargo docs recommend caching. Cargo rebuilds the rest from them.
      # The key includes Cargo.toml, because a profile change makes every cached crate useless.
      - name: Restore the Rust build cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ steps.rust.outputs.version }}-

      - name: Build the app and installer
        working-directory: ui
        run: npm run tauri -- build --ci

      # Release profile, so it reuses what the app build just compiled.
      - name: Test the Rust core
        working-directory: src-tauri
        run: cargo test --release --locked

      - name: Save the Rust build cache
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: diffract-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # The job id "build" is a required status check in .github/rulesets/protect-main.json.
  # Renaming it blocks every PR from merging. Do not rename it.
  # It passes only when every other job passed, or when the PR changes only docs and they were skipped on purpose.
  build:
    needs: [ scope, dotnet, ui, app ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the other jobs
        env:
          SCOPE: ${{ needs.scope.result }}
          CODE: ${{ needs.scope.outputs.code }}
          DOTNET: ${{ needs.dotnet.result }}
          UI: ${{ needs.ui.result }}
          APP: ${{ needs.app.result }}
        run: |
          echo "scope: $SCOPE, .NET tests: $DOTNET, UI tests: $UI, app: $APP"
          if [ "$SCOPE" != success ]; then echo "::error::The docs-only check did not pass."; exit 1; fi
          if [ "$CODE" = false ]; then echo "Only docs changed."; exit 0; fi
          if [ "$DOTNET" != success ] || [ "$UI" != success ] || [ "$APP" != success ]; then
            echo "::error::At least one job did not pass. Open it in the list on the left to see why."
            exit 1
          fi
