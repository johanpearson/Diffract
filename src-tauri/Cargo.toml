[package]
name = "diffract"
version = "0.1.0"
description = "A Git desktop client for Windows that understands worktrees and agent leftovers"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-shell = "2.5"

# No link-time optimization: with it, every build re-optimizes all of Tauri at the final link,
# which took 2.5 minutes in CI even with a warm cache. The installer is a little bigger without it.
[profile.release]
strip = true
